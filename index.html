<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Edwin's Annuity Dash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9e7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#17304b;font-weight:800;font-size:13px;pointer-events:none;text-shadow:0 1px #fff}</style></head><body><canvas id="game"></canvas><div id="hint">TAP ANYWHERE TO JUMP</div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,ground=0,player,obs=[],score=0,best=0,speed=0,spawn=0,state='ready',last=0,t=0,shake=0;
try{best=Number(localStorage.getItem('edwinAnnuityBest')||0)}catch(e){}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.76;if(player)player.y=Math.min(player.y,ground-player.h)}
addEventListener('resize',resize);resize();
function reset(){player={x:W*.2,y:ground-68,w:35,h:68,vy:0};obs=[];score=0;speed=Math.max(260,W*.62);spawn=.85;state='playing';t=0;shake=0}
function jump(){if(state!=='playing'){reset();return}if(player.y>=ground-player.h-2){player.vy=-Math.min(760,Math.max(610,H*.98));beep(550,.07)}}
let audio;function beep(freq,dur){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='square';g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(s,x,y,size,color='#17304b',align='center',weight=800){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function update(dt){if(state!=='playing')return;t+=dt;speed=Math.max(260,W*.62)+Math.min(score*13,220);player.vy+=1800*dt;player.y+=player.vy*dt;if(player.y>ground-player.h){player.y=ground-player.h;player.vy=0}spawn-=dt;if(spawn<=0){const w=42+Math.random()*12;obs.push({x:W+30,y:ground-46,w,h:46,passed:false});spawn=Math.max(.8,1.4-score*.015)+Math.random()*.45}for(const o of obs){o.x-=speed*dt;if(!o.passed&&o.x+o.w<player.x){o.passed=true;score++;beep(850,.045)}if(player.x+player.w-9>o.x+5&&player.x+8<o.x+o.w-5&&player.y+player.h-5>o.y+5&&player.y+10<o.y+o.h){state='over';shake=12;beep(160,.25);if(score>best){best=score;try{localStorage.setItem('edwinAnnuityBest',best)}catch(e){}}}}obs=obs.filter(o=>o.x+o.w>-20)}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#8dd8ff');sky.addColorStop(1,'#f4faff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffeb99';ctx.beginPath();ctx.arc(W*.83,H*.16,34,0,Math.PI*2);ctx.fill();let off=(t*speed*.17)%110;for(let i=-2;i<W/110+3;i++){let x=i*110-off;ctx.fillStyle=i%2?'#91b7d0':'#a4c6dc';ctx.fillRect(x,ground-170,95,170);ctx.fillStyle='#dff4ff';for(let j=0;j<3;j++)for(let k=0;k<2;k++)ctx.fillRect(x+14+k*40,ground-150+j*43,22,25)}ctx.fillStyle='#5eaa6d';ctx.fillRect(0,ground-11,W,11);ctx.fillStyle='#454e64';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#f9d87c';let stripe=(t*speed)%125;for(let x=-125-stripe;x<W+125;x+=125)ctx.fillRect(x,ground+(H-ground)*.52,68,6);
for(const o of obs){rounded(o.x+3,o.y+5,o.w,o.h,4,'#243f61');rounded(o.x,o.y,o.w,o.h,4,'#fffdf2');ctx.strokeStyle='#6c9eb9';ctx.lineWidth=1.3;ctx.strokeRect(o.x+5,o.y+5,o.w-10,o.h-10);text('ANNUITY',o.x+o.w/2,o.y+16,8,'#254b79');text('CONTRACT',o.x+o.w/2,o.y+26,7,'#254b79');text('SUMMARY',o.x+o.w/2,o.y+36,7,'#254b79')}
let p=player||{x:W*.2,y:ground-68,w:35,h:68,vy:0};let run=state==='playing'&&p.vy===0?Math.sin(t*19)*9:0;ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#26354e';ctx.beginPath();ctx.moveTo(p.x+16,p.y+48);ctx.lineTo(p.x+8+run,p.y+66);ctx.moveTo(p.x+22,p.y+48);ctx.lineTo(p.x+30-run,p.y+66);ctx.stroke();rounded(p.x+5,p.y+24,29,29,6,'#2777b7');ctx.strokeStyle='#e5a67b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+7,p.y+31);ctx.lineTo(p.x-2,p.y+42+run*.3);ctx.moveTo(p.x+31,p.y+31);ctx.lineTo(p.x+40,p.y+40-run*.3);ctx.stroke();ctx.fillStyle='#f0b78c';ctx.beginPath();ctx.arc(p.x+19,p.y+14,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#523d35';ctx.beginPath();ctx.arc(p.x+19,p.y+8,15,Math.PI*1.06,Math.PI*1.94);ctx.fill();ctx.fillStyle='#202a35';ctx.fillRect(p.x+24,p.y+14,3,3);ctx.strokeStyle='#9a543d';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(p.x+23,p.y+18,5,.1,1.4);ctx.stroke();
rounded(14,Math.max(15,H*.045),135,51,13,'#ffffffdd');text('SCORE  '+score,81,Math.max(15,H*.045)+32,23);rounded(W-125,Math.max(15,H*.045),111,51,13,'#ffffffdd');text('BEST  '+best,W-69,Math.max(15,H*.045)+32,17);if(state!=='playing'){ctx.fillStyle='#102c4d99';ctx.fillRect(0,0,W,H);rounded(W*.08,H*.31,W*.84,205,18,'#fffdf5');text(state==='over'?'GAME OVER':'EDWIN’S',W/2,H*.31+55,30);text(state==='over'?`Score: ${score}`:'ANNUITY DASH',W/2,H*.31+94,state==='over'?25:24);text(state==='over'?'Tap to try again':'Tap to start running!',W/2,H*.31+148,18,'#3271a4');}ctx.restore()}
function frame(now){let dt=Math.min((now-last)/1000||0,.034);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
